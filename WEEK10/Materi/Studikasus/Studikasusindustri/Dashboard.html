<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Dashboard.css">
    <title>Dashboard Admin</title>
</head>
<body>
<div class="dashboard">

    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li>Dashboard</li>
            <li>Produk</li>
            <li>Pesanan</li>
            <li>Laporan</li>
        </ul>
    </aside>

    <header class="header">
        <h2>Dashboard Admin</h2>
    </header>

    <main class="content">
        <div class="card">
            <h3>Total Produk</h3>
            <p>150</p>
        </div>

        <div class="card">
            <h3>Total Pesanan</h3>
            <p>320</p>
        </div>

        <div class="card">
            <h3>Pendapatan</h3>
            <p>Rp 25.000.000</p>
        </div>

        <div class="card grafik">
            <h3>Grafik Penjualan</h3>
            <p>Area grafik ditampilkan di sini.</p>
        </div>
    </main>

</div>
</body>
</html>
