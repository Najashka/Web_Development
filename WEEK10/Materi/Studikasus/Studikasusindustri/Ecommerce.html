<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Ecommerce.css">
    <title>E-Commerce</title>
</head>
<body>

    <!-- NAVBAR -->
<div class="navbar">
    <h2>WarmShop ☕</h2>
    <div class="cart">Cart (2)</div>
</div>

<!-- MAIN -->
<div class="container">

    <!-- PRODUCTS -->
    <div class="products">

        <div class="card">
            <h3>Cozy Lamp</h3>
            <p class="price">Rp 120.000</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <h3>Coffee Mug</h3>
            <p class="price">Rp 45.000</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <h3>Wooden Table</h3>
            <p class="price">Rp 1.200.000</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <h3>Soft Blanket</h3>
            <p class="price">Rp 250.000</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <!-- CART -->
    <div class="sidebar">
        <h3>Your Cart</h3>
        <p>☕ Coffee Mug</p>
        <p>💡 Cozy Lamp</p>
        <hr>
        <p><b>Total: Rp 165.000</b></p>
    </div>

</div>


</body>
</html>
