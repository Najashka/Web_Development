<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile + Navbar</title>

    <link rel="stylesheet" href="Latihanall.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">Ryuze</div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#profile">Profile</a></li>
        <li><a href="#gallery">Gallery</a></li>
    </ul>

    <button class="btn">Login</button>
</nav>

<!-- PROFILE -->
<section class="profile-wrapper" id="profile">
    <div class="profile-card">

        <img src="https://i.pravatar.cc/300" alt="profile">

        <h1>Naja Muhammad Risqi</h1>
        <p class="role">Frontend Developer Beginner</p>

        <p class="desc">
            Saya sedang belajar HTML, CSS, dan JavaScript untuk menjadi Frontend Developer profesional.
        </p>

        <div class="info">
            <div>
                <h3>Umur</h3>
                <p>18</p>
            </div>

            <div>
                <h3>Domisili</h3>
                <p>Indonesia</p>
            </div>

            <div>
                <h3>Hobi</h3>
                <p>Tidur</p>
            </div>
        </div>

        <div class="social">
            <a href="#" class="icon facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="icon twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="icon linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>

        <button>Follow</button>

    </div>
</section>

<!-- GALLERY -->
<section class="gallery-section" id="gallery">

    <div class="gallery-container">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" />
        <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=600" />
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" />
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" />
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" />
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600" />

    </div>

</section>

</body>
</html>
