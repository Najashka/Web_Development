<!DOCTYPE html>

<html>
<head>
    <title>Latihan 3</title>
</head>
<body>

<input type="number" id="angka1">
<input type="number" id="angka2">

<button onclick="hitung()">
Jumlahkan
</button>

<h3 id="hasil"></h3>

<script>
function hitung(){

let a =
parseInt(document.getElementById("angka1").value);

let b =
parseInt(document.getElementById("angka2").value);

document.getElementById("hasil").innerHTML =
"Hasil : " + (a+b);

}
</script>

</body>
</html>
