<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript Dasar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1 id="judul">Praktikum JavaScript Dasar & DOM</h1>

        <button onclick="ubahJudul()">
            Ubah Judul
        </button>

        <hr>

        <h2>Biodata Mahasiswa</h2>

        <input type="text" id="nama" placeholder="Masukkan Nama">

        <button onclick="tampilkanBiodata()">
            Tampilkan Biodata
        </button>

        <p id="hasilBiodata"></p>

        <hr>

        <h2>Kalkulator Penjumlahan</h2>

        <input type="number" id="angka1" placeholder="Angka Pertama">

        <input type="number" id="angka2" placeholder="Angka Kedua">

        <button onclick="jumlahkan()">
            Hitung
        </button>

        <p id="hasilHitung"></p>

        <hr>

        <h2>Penentuan Grade</h2>

        <input type="number" id="nilai" placeholder="Masukkan Nilai">

        <button onclick="cekGrade()">
            Cek Grade
        </button>

        <p id="hasilGrade"></p>

        <hr>

        <h2>Perulangan</h2>

        <button onclick="tampilkanAngka()">
            Tampilkan Angka 1-5
        </button>

        <ul id="listAngka"></ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
